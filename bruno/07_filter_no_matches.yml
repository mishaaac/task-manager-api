info:
  name: 07 - Filter with no matches
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/tasks?status=pending&priority=low&tag=work&search=zzzsintareasbrunozzz"
  params:
    - name: status
      value: pending
      type: query
    - name: priority
      value: low
      type: query
    - name: tag
      value: work
      type: query
    - name: search
      value: zzzsintareasbrunozzz
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Returns 200 even when no tasks match", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Returns an empty page", function () {
          const body = res.getBody();
          expect(body.items).to.deep.equal([]);
          expect(body.total).to.equal(0);
          expect(body.total_pages).to.equal(0);
          expect(body.page).to.equal(1);
          expect(body.has_prev).to.equal(false);
          expect(body.has_next).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Expected: 200 with items: [], total: 0 and total_pages: 0.
  The search text does not match the startup examples or the tasks created by this collection.
