info:
  name: 04 - List all tasks
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/tasks"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Returns 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Returns an array containing both created tasks", function () {
          expect(body).to.be.an("array");
          expect(body).to.deep.include(JSON.parse(bru.getVar("task1_snapshot")));
          expect(body).to.deep.include(JSON.parse(bru.getVar("task2_snapshot")));
        });

        test("The task with an invalid email was not saved", function () {
          expect(body.some(task => task.author.email === "correo-invalido")).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Expected: 200 and an array of tasks, without a count/data wrapper.
  With an empty initial store, it should contain exactly the two created tasks.
