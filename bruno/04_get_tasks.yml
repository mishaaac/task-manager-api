info:
  name: 04 - List all tasks
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/tasks?per_page=50&order_by=id&direction=desc"
  params:
    - name: per_page
      value: "50"
      type: query
    - name: order_by
      value: id
      type: query
    - name: direction
      value: desc
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Returns 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Returns a page containing both created tasks", function () {
          expect(body.items).to.be.an("array");
          expect(body.items).to.deep.include(JSON.parse(bru.getVar("task1_snapshot")));
          expect(body.items).to.deep.include(JSON.parse(bru.getVar("task2_snapshot")));
        });

        test("Returns the requested pagination and ordering", function () {
          expect(body.page).to.equal(1);
          expect(body.per_page).to.equal(50);
          expect(body.order_by).to.equal("id");
          expect(body.direction).to.equal("desc");
          expect(body.has_prev).to.equal(false);
          expect(body.items.length).to.be.at.most(50);
        });

        test("The task with an invalid email was not saved", function () {
          expect(body.items.some(task => task.author.email === "correo-invalido")).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Expected: 200 and a paginated object with tasks in items.
  Descending ID order puts the two newly created tasks before the startup examples.
