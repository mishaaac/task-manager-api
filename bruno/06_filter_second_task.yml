info:
  name: 06 - Filter second task
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/tasks?status=in_progress&priority=low&tag=study&tag=personal&direction=desc"
  params:
    - name: status
      value: in_progress
      type: query
    - name: priority
      value: low
      type: query
    - name: tag
      value: study
      type: query
    - name: tag
      value: personal
      type: query
    - name: direction
      value: desc
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Returns 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Includes the second task and excludes the first", function () {
          expect(body.items).to.be.an("array");
          expect(body.items).to.deep.include(JSON.parse(bru.getVar("task2_snapshot")));
          expect(body.items.some(task => task.id === bru.getVar("task1_id"))).to.equal(false);
        });

        test("Every task matches status, priority, and both requested tags", function () {
          body.items.forEach(task => {
            expect(task.status).to.equal("in_progress");
            expect(task.priority).to.equal("low");
            expect(task.tags).to.include("study");
            expect(task.tags).to.include("personal");
          });
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Expected: 200 and a page whose items include the second task.
  Descending ID order keeps the newly created task on the first page.
  Checks a different combination of status, priority, and tag.
  Both study and personal must be present in every returned task.
