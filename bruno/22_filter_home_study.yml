info:
  name: 22 - Filter by home and study
  type: http
  seq: 22

http:
  method: GET
  url: "{{base_url}}/tasks?tag=home&tag=study&per_page=50"
  params:
    - name: tag
      value: home
      type: query
    - name: tag
      value: study
      type: query
    - name: per_page
      value: "50"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Returns 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Requires both tags and allows additional tags", function () {
          expect(body.items).to.have.lengthOf(50);
          body.items.forEach(task => {
            expect(task.tags).to.include("home");
            expect(task.tags).to.include("study");
          });
          expect(body.items.some(task => task.tags.length === 2)).to.equal(true);
          expect(body.items.some(task => task.tags.length > 2)).to.equal(true);
        });

        test("Paginates the 51 matching examples across two pages", function () {
          expect(body.total).to.equal(51);
          expect(body.total_pages).to.equal(2);
          expect(body.page).to.equal(1);
          expect(body.per_page).to.equal(50);
          expect(body.has_prev).to.equal(false);
          expect(body.has_next).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Expected: 200 with total: 51 and total_pages: 2 using the bundled examples.
  Repeating tag requires both home and study before counting or pagination.
