info:
  name: 21 - Filter by home
  type: http
  seq: 21

http:
  method: GET
  url: "{{base_url}}/tasks?tag=home&per_page=50"
  params:
    - name: tag
      value: home
      type: query
    - name: per_page
      value: "50"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("Returns 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("Matches home alone and home with additional tags", function () {
          expect(body.total).to.equal(98);
          expect(body.items).to.have.lengthOf(50);
          body.items.forEach(task => expect(task.tags).to.include("home"));
          expect(body.items.some(task => task.tags.length === 1)).to.equal(true);
          expect(body.items.some(task => task.tags.length > 1)).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: true
  maxRedirects: 5

docs: |-
  Expected: 200 with total: 98 using the bundled examples.
  Every item must contain home; additional tags are allowed.
