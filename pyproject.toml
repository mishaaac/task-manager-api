[project]
name = "task-manager-api"
version = "0.1.0"
description = "A practice API for managing tasks in memory with FastAPI."
readme = "README.md"
authors = [
    { name = "mishaaac" }
]
requires-python = ">=3.14"
keywords = ["fastapi", "tasks", "rest-api"]
dependencies = [
    "fastapi[standard]>=0.162.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
