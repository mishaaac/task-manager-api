[project]
name = "task-manager-api"
version = "0.2.0"
description = "An in-memory task API with Pydantic validation, filters, and partial updates."
readme = "README.md"
authors = [
    { name = "mishaaac" }
]
requires-python = ">=3.14"
keywords = ["fastapi", "tasks", "rest-api"]
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pydantic[email]>=2.14.2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
